name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build HarborGate control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

      - name: Test Go packages with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Type-check web application
        working-directory: web
        run: npm run check

      - name: Build web application
        working-directory: web
        run: npm run build

      - name: Build production server
        run: go build -trimpath -o bin/harborgate ./cmd/harborgate

      - name: Build container
        run: docker build --build-arg COMMIT=${{ github.sha }} -t harborgate:ci .
